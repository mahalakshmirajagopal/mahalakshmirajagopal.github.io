  - name: theme
    label: Look and feel (colour theme, background colours, photos)
    type: file
    path: _data/theme.yml
    fields:
      - name: colour_theme
        label: Colour theme
        description: A ready-made set of colours for the whole site.
        type: select
        options: { values: [Dawn, Forest, Ocean, Lotus, Lavender] }
      - name: photos
        label: Background photos
        type: object
        fields:
          - { name: quote, label: Behind the quote near the top, type: image }
          - { name: series, label: Behind the Self Healing Series, type: image }
          - { name: contact, label: Behind the contact section, type: image }
          - { name: testimonials_page, label: Top of the Testimonials page, type: image }
      - name: colours
        label: Your own colours (optional)
        description: Leave a box empty to use the colour from the theme above. Text colours are on the Fonts and text colours page. Colours here are written like #2d3047; you can pick one at htmlcolorcodes.com and copy its code.
        type: object
        fields:
          - { name: background, label: Page background, type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }
          - { name: background_soft, label: Soft background (behind cards and some sections), type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }
          - { name: text, label: Main text and headings, type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }
          - { name: text_soft, label: Softer text, type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }
          - { name: accent, label: Accent (small labels, links), type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }
          - { name: accent_light, label: Light accent (on dark sections, buttons), type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }
          - { name: highlight, label: Highlight, type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }
          - { name: dark, label: Dark sections and buttons, type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }
          - { name: hero_top, label: Top of the page, sky colour 1, type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }
          - { name: hero_middle, label: Top of the page, sky colour 2, type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }
          - { name: hero_bottom, label: Top of the page, sky colour 3, type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "Use a colour code like #2d3047, or leave it empty" } }

