heading: A beautiful inner journey
intro: Mahalakshmi has been guiding individuals in meditation for the last two decades. Her meditations are easy to learn and to practise on your own.
offerings:
  - tag: Guided meditation
    title: Meditation
    text: Mahalakshmi offers customised meditations, and teaches Chakra Meditations and Healing Guidance Meditations. Her guided meditations enable participants to experience a beautiful inner journey.
    duration: Online & offline
  - tag: One-to-one
    title: Inner Wisdom Facilitation Sessions
    text: Deep insights on topics like karma, women and the practices that bind them, social conditioning as a block to spiritual progress, and many more. Guidance seekers are welcome to bring their own questions. Each session also includes short meditation or reflective practices.
    duration: 1 hour per session
