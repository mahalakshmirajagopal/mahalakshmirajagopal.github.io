pillars:
  - title: Body
    text: Your body is a temple. Learn to sense it, listen to it and support its own capacity to heal.
  - title: Mind
    text: Release limiting beliefs and subconscious patterns that keep old challenges returning.
  - title: Heart
    text: Heal emotional wounds and build lasting resilience, inner peace and freedom.
  - title: Soul
    text: Awaken higher consciousness and align with your soul’s purpose and the flow of divine energy.
