heading: Learn to heal yourself
intro: Experience energy beyond intellectual understanding. Through practical exercises, meditation, body awareness and experiential learning, you learn to sense your chakras, understand your energy field and build practices that support lasting wellbeing.
photo: /images/clear-water-headland.jpg
photo_description: Clear, shallow water over rippled sand beside a green headland
series:
  title: Self Healing Series
  text: Four modules focused on healing yourself. Each module is a full day, or two half days.
  modules:
    - title: Healing Your Body
      text: Your body is a temple. A step-by-step, experiential workshop to connect with your body through the senses and feel its subtle space. With practice, a close, sacred relationship with your body slowly unfolds.
    - title: EFT Techniques for Healing
      text: Learn the principles of EFT and how to use it on yourself. Guided practice sessions help you apply it to both physical and emotional concerns.
    - title: Aura and Chakras
      text: Discover the chakras, their properties and their link with the physical body. Learn to sense the aura and the state of each chakra, and how to cleanse and energise them.
    - title: Crystals
      text: Crystals are tools, companions and guides. Learn to choose the right crystal, cleanse and programme it, and use it well.
workshops:
  - tag: 5½ days · Levels 1 to 3
    title: Energy Healing Training
    text: Intense, experiential training to heal yourself and practise healing others, face to face and through distant healing. Each level builds on the last, moving from simple techniques for physical ailments to complex techniques for psychological ones. Based on the courses founded by Master Choa Kok Sui, with content, delivery and guidelines created by Mahalakshmi.
    duration: Levels 1–3
  - tag: One day
    title: Your Body, A Temple
    text: Connect deeply with your own body, and learn to heal it by sensing what your body is communicating to you.
    duration: Full day
  - tag: One day
    title: EFT Workshop
    text: Learn to free yourself of a range of emotional blocks and ailments using Emotional Freedom Technique.
    duration: Full day
note: In-person trainings are the most powerful way to learn, but online trainings are also offered if you cannot attend in person. Mahalakshmi also designs customised workshops on request, including workshops on the energy field and chakras for groups and organisations.
